---
- name: Query defined programs in CICS

  #hosts: "localhost"
  hosts: localhost
  gather_facts: false

  vars:
    attributes:
      - eyu_cicsname
      - release
      - jobid
      - totltasks

  tasks:
    # Install module dependencies
    - name: Make sure CMCI module dependencies are installed
      ansible.builtin.pip:
        name:
          - requests
          - xmltodict
          - typing;python_version<"3.5"

    - name: Retrieve PROGRAM resources
      ibm.ibm_zos_cics.cmci_get:
        cmci_host: "{{ cmci_host }}"
        cmci_port: "{{ cmci_port }}"
        cmci_user: "{{ cmci_user | default(omit) }}"
        cmci_password: "{{ cmci_password | default(omit) }}"
        scheme: "{{ cmci_scheme }}"
        insecure: true          # remove if using trusted certificates

        context: "{{ cmci_context }}"
        type: CICSProgram

        resources:
          filter:
            program: "MDG*"

      register: result

    - name: Display program name list
      debug:
        var: program_names
      vars:
        program_names: "{{ result.records | map(attribute='program') | list }}"

    - name: Generate CICS Prometheus metrics
      ansible.builtin.copy:
        dest: "{{ cics_metrics_path }}"
        mode: "0600"
        content: |
          # HELP cics_program_info Static information about CICS programs
          # TYPE cics_program_info gauge
          {% for record in result.records %}
          cics_program_info{program="{{ record.program | default('unknown') }}"} 1
          {% endfor %}

          # HELP cics_program_total Number of CICS programs
          # TYPE cics_program_total gauge
          cics_program_total {{ result.records | length }}

    - name: Check generated CICS metrics file
      ansible.builtin.stat:
        path: "{{ cics_metrics_path }}"
      register: cics_metrics_file

    - name: Validate generated CICS metrics
      ansible.builtin.assert:
        that:
          - cics_metrics_file.stat.exists
          - cics_metrics_file.stat.isreg
          - cics_metrics_file.stat.size | int > 0
        fail_msg: "The CICS Prometheus metrics file was not generated or is empty."
        success_msg: >-
          CICS Prometheus metrics generated successfully at
          {{ cics_metrics_path }} with size
          {{ cics_metrics_file.stat.size }} bytes.

    - name: Display generated CICS metrics
      ansible.builtin.command:
        cmd: "cat {{ cics_metrics_path }}"
      register: displayed_cics_metrics
      changed_when: false

    - name: Show CICS Prometheus metrics
      ansible.builtin.debug:
        var: displayed_cics_metrics.stdout_lines