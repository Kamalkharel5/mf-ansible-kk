---
# Generic JCL runner.
#
# Required:
#   -e "jcl_file=hello_world.jcl"
#
# Optional:
#   -e "jcl_file=create_customer_file.jcl student_id=STU01"

- name: Submit JCL from jcl/ directory
  hosts: zos
  gather_facts: false

  collections:
    - ibm.ibm_zos_core

  environment: "{{ environment_vars }}"

  vars:
    remote_jcl_path: "/u/ibmuser/{{ jcl_file | default('submitted_job.jcl') }}"

  tasks:

    - name: Validate jcl_file is set
      ansible.builtin.assert:
        that:
          - jcl_file is defined
          - jcl_file | trim | length > 0
        fail_msg: "jcl_file is required. Set the JCL_FILE pipeline variable."

    - name: Derive student-scoped naming variables
      ansible.builtin.set_fact:
        student_id_upper: >-
          {{
            student_id | upper
            if student_id is defined and student_id | trim | length > 0
            else ''
          }}
        job_prefix: >-
          {{
            (student_id | upper)[:5]
            if student_id is defined and student_id | trim | length > 0
            else ''
          }}
        ds_hlq: >-
          {{
            'IBMUSER.' ~ (student_id | upper)
            if student_id is defined and student_id | trim | length > 0
            else 'IBMUSER'
          }}

    - name: Render JCL template and copy to USS
      ibm.ibm_zos_core.zos_copy:
        content: "{{ lookup('template', playbook_dir ~ '/jcl/' ~ jcl_file) }}"
        dest: "{{ remote_jcl_path }}"
        force: true
      register: jcl_copy_result

    - name: Submit job
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ remote_jcl_path }}"
        location: USS
        wait_time_s: 60
        return_output: true
        max_rc: 4
      register: job_output

    - name: Validate job submission result
      ansible.builtin.assert:
        that:
          - job_output.jobs is defined
          - job_output.jobs | length > 0
          - job_output.jobs[0].job_id is defined
          - job_output.jobs[0].ret_code is defined
          - job_output.jobs[0].ret_code.msg is defined
        fail_msg: "The JCL submission module returned no usable job result."

    - name: Display job ID and return code
      ansible.builtin.debug:
        msg: >-
          Job {{ job_output.jobs[0].job_id }}
          completed with {{ job_output.jobs[0].ret_code.msg }}

    - name: Display spool output
      ansible.builtin.debug:
        msg: "{{ job_output.jobs[0].ddnames | default([]) | map(attribute='content') | list }}"

    - name: Parse job output into metric values
      ansible.builtin.set_fact:
        _job_id: "{{ job_output.jobs[0].job_id }}"
        _job_name: "{{ job_output.jobs[0].job_name | default('UNKNOWN') }}"
        _rc_num: >-
          {{
            (
              job_output.jobs[0].ret_code.msg
              | regex_replace('^CC\\s+0*(\\d+)$', '\\1')
              | int
            )
            if job_output.jobs[0].ret_code.msg is match('^CC\\s+\\d+$')
            else -1
          }}
        _success: >-
          {{
            1
            if (
              job_output.jobs[0].ret_code.msg is match('^CC\\s+\\d+$')
              and
              (
                job_output.jobs[0].ret_code.msg
                | regex_replace('^CC\\s+0*(\\d+)$', '\\1')
                | int
              ) <= 4
            )
            else 0
          }}

    - name: Concatenate all spool content
      ansible.builtin.set_fact:
        _spool_text: >-
          {{
            job_output.jobs[0].ddnames
            | default([])
            | map(attribute='content')
            | list
            | flatten
            | join('\n')
          }}

    - name: Parse record counts
      ansible.builtin.set_fact:
        _records_in: >-
          {{
            (
              _spool_text
              | regex_search('RECORDS[^\\n]*IN[:\\s=]+(\\d+)', '\\1')
              or ['0']
            )
            | first
          }}
        _records_out: >-
          {{
            (
              _spool_text
              | regex_search('RECORDS[^\\n]*OUT[:\\s=]+(\\d+)', '\\1')
              or ['0']
            )
            | first
          }}

    - name: Write Prometheus metrics
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/job_metrics.prom"
        mode: "0644"
        content: |
          # HELP zos_job_return_code z/OS job numeric return code
          # TYPE zos_job_return_code gauge
          zos_job_return_code{job_id="{{ _job_id }}",job_name="{{ _job_name }}",student="{{ student_id_upper }}",jcl="{{ jcl_file }}"} {{ _rc_num }}

          # HELP zos_job_success 1 if job completed successfully
          # TYPE zos_job_success gauge
          zos_job_success{job_id="{{ _job_id }}",job_name="{{ _job_name }}",student="{{ student_id_upper }}",jcl="{{ jcl_file }}"} {{ _success }}

          # HELP zos_job_records_in Input records processed
          # TYPE zos_job_records_in gauge
          zos_job_records_in{job_id="{{ _job_id }}",job_name="{{ _job_name }}",student="{{ student_id_upper }}",jcl="{{ jcl_file }}"} {{ _records_in }}

          # HELP zos_job_records_out Output records processed
          # TYPE zos_job_records_out gauge
          zos_job_records_out{job_id="{{ _job_id }}",job_name="{{ _job_name }}",student="{{ student_id_upper }}",jcl="{{ jcl_file }}"} {{ _records_out }}
      delegate_to: localhost