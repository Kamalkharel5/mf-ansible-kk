---
- name: Deploy Grafana and Pushgateway
  hosts: frontend
  become: true

  vars:
    config_dir: /opt/monitoring

  handlers:
    - name: Restart Grafana
      community.docker.docker_container:
        name: grafana
        state: started
        restart: true

  tasks:
    ###########################################################################
    # Create Grafana provisioning directories
    ###########################################################################

    - name: Create Grafana directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/grafana
        - /opt/grafana/provisioning
        - /opt/grafana/provisioning/datasources
        - /opt/grafana/provisioning/dashboards
        - /opt/grafana/dashboards

    ###########################################################################
    # Copy provisioning configuration
    ###########################################################################

    - name: Copy dashboard provider configuration
      ansible.builtin.copy:
        src: ../grafana/provisioning/dashboards/dashboards.yml
        dest: /opt/grafana/provisioning/dashboards/dashboards.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    - name: Copy Prometheus datasource configuration
      ansible.builtin.template:
        src: ../grafana/provisioning/datasources/prometheus.yml.j2
        dest: /opt/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    ###########################################################################
    # Copy dashboards
    ###########################################################################

    - name: Copy Grafana dashboards
      ansible.builtin.copy:
        src: ../grafana/dashboards/
        dest: /opt/grafana/dashboards/
        owner: root
        group: root
        mode: "0644"
      notify: Restart Grafana

    ###########################################################################
    # Run Grafana
    ###########################################################################

    - name: Run Grafana
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        ports:
          - "3000:3000"
        env:
          GF_SECURITY_ADMIN_PASSWORD: "admin"
        volumes:
          - grafana_data:/var/lib/grafana
          - /opt/grafana/provisioning:/etc/grafana/provisioning:ro
          - /opt/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ###########################################################################
    # Run Pushgateway
    ###########################################################################

    - name: Run Pushgateway
      community.docker.docker_container:
        name: pushgateway
        image: prom/pushgateway
        state: started
        restart_policy: always
        ports:
          - "9091:9091"
