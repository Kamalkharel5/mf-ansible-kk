apiVersion: 1

providers:
  - name: Mainframe Capstone Dashboards
    orgId: 1
    folder: Mainframe Capstone
    folderUid: mainframe-capstone
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false