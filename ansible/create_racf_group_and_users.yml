---
- name: Create and verify RACF group and users
  hosts: zos
  gather_facts: false

  collections:
    - ibm.ibm_zos_core

  vars:
    racf_group: TEAM01
    group_owner: IBMUSER

    # Supply securely with Ansible Vault, GitHub Actions secrets,
    # or -e "racf_default_password=..."
    default_password: "{{ racf_default_password }}"

    racf_users:
      - userid: USER01
        name: "Development User 01"

      - userid: USER02
        name: "Development User 02"

      - userid: USER03
        name: "Development User 03"

  pre_tasks:
    - name: Validate required RACF variables
      ansible.builtin.assert:
        that:
          - racf_group is defined
          - racf_group | length > 0
          - group_owner is defined
          - group_owner | length > 0
          - racf_users is defined
          - racf_users | length > 0
          - racf_default_password is defined
          - racf_default_password | length > 0
        fail_msg: >-
          Required RACF variables are missing. Supply racf_default_password
          securely with Ansible Vault, GitHub Actions secrets, or an extra variable.
        success_msg: "Required RACF variables are present."

    - name: Initialize RACF Prometheus metrics
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/job_metrics.prom"
        mode: "0644"
        content: |
          # HELP racf_group_exists Whether the expected RACF group exists
          # TYPE racf_group_exists gauge
          racf_group_exists{group="{{ racf_group }}"} 0

          # HELP racf_users_total Total number of RACF users expected
          # TYPE racf_users_total gauge
          racf_users_total {{ racf_users | length }}

          # HELP racf_users_verified Number of RACF users successfully verified
          # TYPE racf_users_verified gauge
          racf_users_verified 0

          # HELP racf_group_memberships_verified Number of RACF group memberships successfully verified
          # TYPE racf_group_memberships_verified gauge
          racf_group_memberships_verified 0

          # HELP racf_playbook_success Whether RACF provisioning and verification succeeded
          # TYPE racf_playbook_success gauge
          racf_playbook_success 0
      delegate_to: localhost
      run_once: true

  tasks:
    ####################################################################
    # RACF group management and connection test
    ####################################################################

    - name: Check whether RACF group exists
      zos_tso_command:
        commands:
          - "LISTGRP {{ racf_group }}"
        max_rc: 8
      register: group_check
      changed_when: false
      failed_when: false

    - name: Display complete LISTGRP result
      ansible.builtin.debug:
        var: group_check

    - name: Validate that LISTGRP executed
      ansible.builtin.assert:
        that:
          - group_check is defined
          - group_check.rc | default(0) | int == 0
          - group_check.output is defined
          - group_check.output | length > 0
          - group_check.output[0].rc is defined
        fail_msg: >-
          LISTGRP did not execute successfully.
          {{ group_check.module_stderr | default(group_check.msg | default('No module error details returned.')) }}
        success_msg: "LISTGRP returned a valid TSO command response."

    - name: Determine whether RACF group exists
      ansible.builtin.set_fact:
        racf_group_exists_fact: "{{ group_check.output[0].rc | int == 0 }}"

    - name: Display RACF group existence result
      ansible.builtin.debug:
        msg: >-
          RACF group {{ racf_group }}
          {{ 'exists' if racf_group_exists_fact else 'does not exist' }}.

    - name: Create missing RACF group
      zos_tso_command:
        commands:
          - "ADDGROUP {{ racf_group }} OWNER({{ group_owner }})"
        max_rc: 4
      when: not racf_group_exists_fact
      register: group_create_result

    - name: Display RACF group creation result
      ansible.builtin.debug:
        var: group_create_result
      when: not racf_group_exists_fact

    ####################################################################
    # RACF user management
    ####################################################################

    - name: Check whether RACF users exist
      zos_tso_command:
        commands:
          - "LISTUSER {{ item.userid }}"
        max_rc: 8
      loop: "{{ racf_users }}"
      loop_control:
        label: "{{ item.userid }}"
      register: user_checks
      changed_when: false
      failed_when: false

    - name: Display RACF user check results
      ansible.builtin.debug:
        var: user_checks

    - name: Create missing RACF users
      zos_tso_command:
        commands:
          - >-
            ADDUSER {{ item.item.userid }}
            NAME('{{ item.item.name }}')
            OWNER({{ racf_group }})
            DFLTGRP({{ racf_group }})
            PASSWORD({{ default_password }})
        max_rc: 4
      loop: "{{ user_checks.results }}"
      loop_control:
        label: "{{ item.item.userid }}"
      when:
        - item.output is defined
        - item.output | length > 0
        - item.output[0].rc is defined
        - item.output[0].rc | int != 0
      register: user_create_results
      no_log: true

    ####################################################################
    # Refresh and group membership management
    ####################################################################

    - name: Refresh RACF user information
      zos_tso_command:
        commands:
          - "LISTUSER {{ item.userid }}"
        max_rc: 8
      loop: "{{ racf_users }}"
      loop_control:
        label: "{{ item.userid }}"
      register: refreshed_user_checks
      changed_when: false
      failed_when: false

    - name: Display refreshed RACF user results
      ansible.builtin.debug:
        var: refreshed_user_checks

    - name: Assert that RACF users are available
      ansible.builtin.assert:
        that:
          - item.output is defined
          - item.output | length > 0
          - item.output[0].rc is defined
          - item.output[0].rc | int == 0
        fail_msg: >-
          RACF user {{ item.item.userid }} was not found after the
          user-management step.
        success_msg: >-
          RACF user {{ item.item.userid }} is available.
      loop: "{{ refreshed_user_checks.results }}"
      loop_control:
        label: "{{ item.item.userid }}"

    - name: Connect users to RACF group when needed
      zos_tso_command:
        commands:
          - "CONNECT {{ item.item.userid }} GROUP({{ racf_group }})"
        max_rc: 4
      loop: "{{ refreshed_user_checks.results }}"
      loop_control:
        label: "Connect {{ item.item.userid }} to {{ racf_group }}"
      when:
        - item.output is defined
        - item.output | length > 0
        - item.output[0].rc is defined
        - item.output[0].rc | int == 0
        - racf_group not in (item.output | string)
      register: connect_results

    ####################################################################
    # Final verification
    ####################################################################

    - name: Verify RACF group
      zos_tso_command:
        commands:
          - "LISTGRP {{ racf_group }}"
        max_rc: 8
      register: verify_group
      changed_when: false
      failed_when: false

    - name: Display final RACF group result
      ansible.builtin.debug:
        var: verify_group

    - name: Assert that RACF group exists
      ansible.builtin.assert:
        that:
          - verify_group.output is defined
          - verify_group.output | length > 0
          - verify_group.output[0].rc is defined
          - verify_group.output[0].rc | int == 0
        fail_msg: >-
          Verification failed: RACF group {{ racf_group }} does not exist.
        success_msg: >-
          Verification passed: RACF group {{ racf_group }} exists.

    - name: Verify RACF users
      zos_tso_command:
        commands:
          - "LISTUSER {{ item.userid }}"
        max_rc: 8
      loop: "{{ racf_users }}"
      loop_control:
        label: "{{ item.userid }}"
      register: verify_users
      changed_when: false
      failed_when: false

    - name: Display final RACF user results
      ansible.builtin.debug:
        var: verify_users

    - name: Assert that RACF users exist
      ansible.builtin.assert:
        that:
          - item.output is defined
          - item.output | length > 0
          - item.output[0].rc is defined
          - item.output[0].rc | int == 0
        fail_msg: >-
          Verification failed: RACF user {{ item.item.userid }} does not exist.
        success_msg: >-
          Verification passed: RACF user {{ item.item.userid }} exists.
      loop: "{{ verify_users.results }}"
      loop_control:
        label: "{{ item.item.userid }}"

    - name: Assert that users are connected to RACF group
      ansible.builtin.assert:
        that:
          - racf_group in (item.output | string)
        fail_msg: >-
          Verification failed: RACF user {{ item.item.userid }}
          is not connected to group {{ racf_group }}.
        success_msg: >-
          Verification passed: RACF user {{ item.item.userid }}
          is connected to group {{ racf_group }}.
      loop: "{{ verify_users.results }}"
      loop_control:
        label: "{{ item.item.userid }}"

    ####################################################################
    # Prometheus metrics
    ####################################################################

    - name: Calculate verified RACF metric totals
      ansible.builtin.set_fact:
        racf_users_verified_count: >-
          {{
            verify_users.results
            | selectattr('output', 'defined')
            | selectattr('output.0.rc', 'defined')
            | selectattr('output.0.rc', 'equalto', 0)
            | list
            | length
          }}
        racf_memberships_verified_count: >-
          {{
            verify_users.results
            | selectattr('output', 'defined')
            | selectattr('output', 'search', racf_group)
            | list
            | length
          }}

    - name: Write successful RACF Prometheus metrics
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/job_metrics.prom"
        mode: "0644"
        content: |
          # HELP racf_group_exists Whether the expected RACF group exists
          # TYPE racf_group_exists gauge
          racf_group_exists{group="{{ racf_group }}"} 1

          # HELP racf_users_total Total number of RACF users expected
          # TYPE racf_users_total gauge
          racf_users_total {{ racf_users | length }}

          # HELP racf_users_verified Number of RACF users successfully verified
          # TYPE racf_users_verified gauge
          racf_users_verified {{ racf_users_verified_count }}

          # HELP racf_group_memberships_verified Number of RACF group memberships successfully verified
          # TYPE racf_group_memberships_verified gauge
          racf_group_memberships_verified {{ racf_memberships_verified_count }}

          # HELP racf_playbook_success Whether RACF provisioning and verification succeeded
          # TYPE racf_playbook_success gauge
          racf_playbook_success 1
      delegate_to: localhost
      run_once: true

    - name: Read generated RACF Prometheus metrics
      ansible.builtin.command:
        cmd: cat "{{ playbook_dir }}/job_metrics.prom"
      delegate_to: localhost
      run_once: true
      register: racf_metrics_output
      changed_when: false

    - name: Display generated RACF Prometheus metrics
      ansible.builtin.debug:
        var: racf_metrics_output.stdout_lines
      run_once: true

    - name: Display final provisioning summary
      ansible.builtin.debug:
        msg:
          - "z/OS TSO command execution: PASS"
          - "RACF group {{ racf_group }}: PASS"
          - >-
            RACF users:
            {{ racf_users | map(attribute='userid') | join(', ') }}
          - "Verified users: {{ racf_users_verified_count }}"
          - "Verified memberships: {{ racf_memberships_verified_count }}"
          - "Group memberships: PASS"
          - "RACF group and user provisioning completed successfully."