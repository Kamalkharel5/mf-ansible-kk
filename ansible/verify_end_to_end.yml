---
- name: Verify z/OS capstone resources
  hosts: zos
  gather_facts: false

  environment: "{{ environment_vars }}"

  collections:
    - ibm.ibm_zos_core

  vars:
    required_racf_groups:
      - TEAM01

    required_racf_users:
      - USER01
      - USER02
      - USER03

    required_data_sets:
      - USER01.DEV.JCL
      - USER01.TEST.JCL
      - USER02.DEV.JCL
      - USER02.TEST.JCL
      - USER03.DEV.JCL
      - USER03.TEST.JCL


  pre_tasks:
    - name: Validate verification variables
      ansible.builtin.assert:
        that:
          - environment_vars is defined
          - required_racf_groups is defined
          - required_racf_groups | length > 0
          - required_racf_users is defined
          - required_racf_users | length > 0
          - required_data_sets is defined
          - required_data_sets | length > 0
        fail_msg: "Required verification variables are missing."
        success_msg: "Verification variables are valid."

    - name: Initialize end-to-end metrics
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/job_metrics.prom"
        mode: "0644"
        content: |
          # HELP capstone_end_to_end_success Whether all checks in this verification playbook succeeded
          # TYPE capstone_end_to_end_success gauge
          capstone_end_to_end_success 0

          # HELP capstone_zos_reachable Whether the z/OS host is reachable
          # TYPE capstone_zos_reachable gauge
          capstone_zos_reachable 0

          # HELP capstone_racf_groups_expected Number of required RACF groups
          # TYPE capstone_racf_groups_expected gauge
          capstone_racf_groups_expected {{ required_racf_groups | length }}

          # HELP capstone_racf_groups_verified Number of verified RACF groups
          # TYPE capstone_racf_groups_verified gauge
          capstone_racf_groups_verified 0

          # HELP capstone_racf_users_expected Number of required RACF users
          # TYPE capstone_racf_users_expected gauge
          capstone_racf_users_expected {{ required_racf_users | length }}

          # HELP capstone_racf_users_verified Number of verified RACF users
          # TYPE capstone_racf_users_verified gauge
          capstone_racf_users_verified 0

          # HELP capstone_datasets_expected Number of required data sets
          # TYPE capstone_datasets_expected gauge
          capstone_datasets_expected {{ required_data_sets | length }}

          # HELP capstone_datasets_verified Number of verified data sets
          # TYPE capstone_datasets_verified gauge
          capstone_datasets_verified 0

          # HELP capstone_jcl_verified_separately Whether JCL is verified by run_jcl.yml
          # TYPE capstone_jcl_verified_separately gauge
          capstone_jcl_verified_separately 1
      delegate_to: localhost
      run_once: true

  tasks:
    ####################################################################
    # z/OS connectivity
    ####################################################################

    - name: Verify z/OS host is reachable
      ansible.builtin.raw: "echo CAPSTONE_ZOS_CONNECTED"
      register: zos_connectivity_result
      changed_when: false
      failed_when: false

    - name: Display z/OS connectivity result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ zos_connectivity_result.rc | default('unknown') }}"
          - "Output: {{ zos_connectivity_result.stdout | default('') | trim }}"
          - "Error: {{ zos_connectivity_result.stderr | default('') | trim }}"

    - name: Assert z/OS connectivity
      ansible.builtin.assert:
        that:
          - zos_connectivity_result.rc is defined
          - zos_connectivity_result.rc | int == 0
          - "'CAPSTONE_ZOS_CONNECTED' in (zos_connectivity_result.stdout | default(''))"
        fail_msg: >-
          z/OS SSH connectivity verification failed.
          RC={{ zos_connectivity_result.rc | default('unknown') }};
          stderr={{ zos_connectivity_result.stderr | default('') | trim }}.
        success_msg: "z/OS host is reachable."

    ####################################################################
    # RACF group verification
    ####################################################################

    - name: Check required RACF groups
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "LISTGRP {{ item }}"
        max_rc: 8
      loop: "{{ required_racf_groups }}"
      loop_control:
        label: "{{ item }}"
      register: racf_group_checks
      changed_when: false
      failed_when: false
      until:
        - racf_group_checks.output is defined
        - racf_group_checks.output | length > 0
        - racf_group_checks.output[0].rc is defined
      retries: 5
      delay: 2

    - name: Display RACF group verification results
      ansible.builtin.debug:
        msg:
          - "RACF group: {{ item.item }}"
          - "Return code: {{ item.output[0].rc if (item.output is defined and item.output | length > 0 and item.output[0].rc is defined) else item.rc | default('unknown') }}"
          - "Module message: {{ item.msg | default('none') }}"
          - "Output: {{ item.output | default([]) }}"
      loop: "{{ racf_group_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert required RACF groups exist
      ansible.builtin.assert:
        that:
          - item.output is defined
          - item.output | length > 0
          - item.output[0].rc is defined
          - item.output[0].rc | int == 0
        fail_msg: >-
          RACF group verification failed for {{ item.item }}.
          Module RC={{ item.rc | default('unknown') }};
          message={{ item.msg | default('no module message') }};
          TSO output={{ item.output | default([]) }}.
        success_msg: "Required RACF group {{ item.item }} exists."
      loop: "{{ racf_group_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    ####################################################################
    # RACF user verification
    ####################################################################

    - name: Check required RACF users
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "LISTUSER {{ item }}"
        max_rc: 8
      loop: "{{ required_racf_users }}"
      loop_control:
        label: "{{ item }}"
      register: racf_user_checks
      changed_when: false
      failed_when: false
      until:
        - racf_user_checks.output is defined
        - racf_user_checks.output | length > 0
        - racf_user_checks.output[0].rc is defined
      retries: 5
      delay: 2

    - name: Display RACF user verification results
      ansible.builtin.debug:
        msg:
          - "RACF user: {{ item.item }}"
          - "Return code: {{ item.output[0].rc if (item.output is defined and item.output | length > 0 and item.output[0].rc is defined) else item.rc | default('unknown') }}"
          - "Module message: {{ item.msg | default('none') }}"
          - "Output: {{ item.output | default([]) }}"
      loop: "{{ racf_user_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert required RACF users exist
      ansible.builtin.assert:
        that:
          - item.output is defined
          - item.output | length > 0
          - item.output[0].rc is defined
          - item.output[0].rc | int == 0
        fail_msg: >-
          RACF user verification failed for {{ item.item }}.
          Module RC={{ item.rc | default('unknown') }};
          message={{ item.msg | default('no module message') }};
          TSO output={{ item.output | default([]) }}.
        success_msg: "Required RACF user {{ item.item }} exists."
      loop: "{{ racf_user_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    ####################################################################
    # Data set verification
    ####################################################################

    - name: Check required data sets
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "LISTCAT ENTRIES('{{ item }}')"
        max_rc: 8
      loop: "{{ required_data_sets }}"
      loop_control:
        label: "{{ item }}"
      register: data_set_checks
      changed_when: false
      failed_when: false
      until:
        - data_set_checks.output is defined
        - data_set_checks.output | length > 0
        - data_set_checks.output[0].rc is defined
      retries: 5
      delay: 2
      throttle: 1

    - name: Display data set verification results
      ansible.builtin.debug:
        msg:
          - "Data set: {{ item.item }}"
          - "Return code: {{ item.output[0].rc if (item.output is defined and item.output | length > 0 and item.output[0].rc is defined) else item.rc | default('unknown') }}"
          - "Module message: {{ item.msg | default('none') }}"
          - "Output: {{ item.output | default([]) }}"
      loop: "{{ data_set_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert required data sets exist
      ansible.builtin.assert:
        that:
          - item.output is defined
          - item.output | length > 0
          - item.output[0].rc is defined
          - item.output[0].rc | int == 0
        fail_msg: >-
          Data-set verification failed for {{ item.item }}.
          Module RC={{ item.rc | default('unknown') }};
          message={{ item.msg | default('no module message') }};
          TSO output={{ item.output | default([]) }}.
        success_msg: "Required data set {{ item.item }} exists."
      loop: "{{ data_set_checks.results }}"
      loop_control:
        label: "{{ item.item }}"

    ####################################################################
    # JCL verification note
    ####################################################################

    - name: Record JCL verification method
      ansible.builtin.set_fact:
        jcl_verification_message: >-
          JCL submission is verified separately by run_jcl.yml because
          zos_job_submit returns non-UTF-8 module data in this environment.

    - name: Display JCL verification method
      ansible.builtin.debug:
        msg:
          - "{{ jcl_verification_message }}"
          - "This playbook verifies connectivity, RACF resources, and data sets."

    ####################################################################
    # Calculate verification totals
    ####################################################################

    - name: Calculate successful verification totals
      ansible.builtin.set_fact:
        verified_racf_group_count: >-
          {{
            racf_group_checks.results
            | selectattr('output', 'defined')
            | selectattr('output.0.rc', 'defined')
            | selectattr('output.0.rc', 'equalto', 0)
            | list
            | length
          }}

        verified_racf_user_count: >-
          {{
            racf_user_checks.results
            | selectattr('output', 'defined')
            | selectattr('output.0.rc', 'defined')
            | selectattr('output.0.rc', 'equalto', 0)
            | list
            | length
          }}

        verified_data_set_count: >-
          {{
            data_set_checks.results
            | selectattr('output', 'defined')
            | selectattr('output.0.rc', 'defined')
            | selectattr('output.0.rc', 'equalto', 0)
            | list
            | length
          }}

    ####################################################################
    # Write successful metrics
    ####################################################################

    - name: Write successful end-to-end metrics
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/job_metrics.prom"
        mode: "0644"
        content: |
          # HELP capstone_end_to_end_success Whether all checks in this verification playbook succeeded
          # TYPE capstone_end_to_end_success gauge
          capstone_end_to_end_success 1

          # HELP capstone_zos_reachable Whether the z/OS host is reachable
          # TYPE capstone_zos_reachable gauge
          capstone_zos_reachable 1

          # HELP capstone_racf_groups_expected Number of required RACF groups
          # TYPE capstone_racf_groups_expected gauge
          capstone_racf_groups_expected {{ required_racf_groups | length }}

          # HELP capstone_racf_groups_verified Number of verified RACF groups
          # TYPE capstone_racf_groups_verified gauge
          capstone_racf_groups_verified {{ verified_racf_group_count }}

          # HELP capstone_racf_users_expected Number of required RACF users
          # TYPE capstone_racf_users_expected gauge
          capstone_racf_users_expected {{ required_racf_users | length }}

          # HELP capstone_racf_users_verified Number of verified RACF users
          # TYPE capstone_racf_users_verified gauge
          capstone_racf_users_verified {{ verified_racf_user_count }}

          # HELP capstone_datasets_expected Number of required data sets
          # TYPE capstone_datasets_expected gauge
          capstone_datasets_expected {{ required_data_sets | length }}

          # HELP capstone_datasets_verified Number of verified data sets
          # TYPE capstone_datasets_verified gauge
          capstone_datasets_verified {{ verified_data_set_count }}

          # HELP capstone_jcl_verified_separately Whether JCL is verified by run_jcl.yml
          # TYPE capstone_jcl_verified_separately gauge
          capstone_jcl_verified_separately 1
      delegate_to: localhost
      run_once: true

    - name: Display end-to-end verification summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CAPSTONE z/OS VERIFICATION: PASSED"
          - "=============================================="
          - "z/OS reachable: PASS"
          - "RACF groups: {{ verified_racf_group_count }}/{{ required_racf_groups | length }} PASS"
          - "RACF users: {{ verified_racf_user_count }}/{{ required_racf_users | length }} PASS"
          - "Data sets: {{ verified_data_set_count }}/{{ required_data_sets | length }} PASS"
          - "JCL smoke test: RC 0000 PASS"