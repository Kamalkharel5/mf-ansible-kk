name: Run Linting
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
    run-lint:
        name: Run Linting
        runs-on: ubuntu-latest
        container:
            image: innovationinsoftware/mf-ansible:1.8.0
        defaults:
            run:
                shell: bash
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: 3.11
              
            - name: Install dependencies
              working-directory: ansible
              run: |
                pip install ansible-lint

            - name: Run linting
              working-directory: ansible
              run: |
                ansible-lint -v