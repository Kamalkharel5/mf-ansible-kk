---
name: Run Ansible Mainframe

on:
  workflow_dispatch:
    inputs:
      PLAYBOOK_NAME:
        description: Ansible playbook to run
        default: master-playbook.yml
        required: true
        type: string
      
      JCL_FILE:
        description: JCL file to submit (optional)
        default: ""
        required: false
        type: string

      STUDENT_ID:
        description: Student ID (optional)
        default: ""
        required: false
        type: string

jobs:
  run-ansible-playbook:
    name: Run Ansible playbook on z/OS
    runs-on: ubuntu-latest

    container:
      image: johndeluce/bootcamp-capstone:latest

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Ansible configuration
        working-directory: ansible

        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_COLLECTIONS_PATHS: /root/.ansible/collections
          PYTHONPATH: /root/.ansible/collections

        run: |
          set -euo pipefail

          chmod 600 id_rsa

          echo "Ansible version:"
          ansible --version

          echo "Installed IBM collection:"
          ansible-galaxy collection list ibm.ibm_zos_core

          echo "Collection directory contents:"
          find /root/.ansible/collections/ansible_collections/ibm \
            -maxdepth 2 \
            -type d \
            2>/dev/null || true

          echo "Parsed inventory:"
          ansible-inventory \
            -i inventory.yml \
            --graph

      - name: Run playbook
        working-directory: ansible

        env:
          PLAYBOOK_NAME: ${{ inputs.PLAYBOOK_NAME }}
          STUDENT_ID: ${{ inputs.STUDENT_ID }}
          JCL_FILE: ${{ inputs.JCL_FILE }}

          RACF_DEFAULT_PASSWORD: ${{ secrets.RACF_DEFAULT_PASSWORD }}
          PUSHGATEWAY_URL: ${{ secrets.PUSHGATEWAY_URL }}

          REPO_SLUG: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}

          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_COLLECTIONS_PATHS: /root/.ansible/collections
          PYTHONPATH: /root/.ansible/collections

        run: |-
          set -uo pipefail

          chmod 600 id_rsa

          ####################################################################
          # Validate workflow inputs and required files
          ####################################################################

          if [[ "${PLAYBOOK_NAME}" == */* ]]; then
            echo "ERROR: PLAYBOOK_NAME must contain only a filename."
            exit 1
          fi

          if [[ ! "${PLAYBOOK_NAME}" =~ \.ya?ml$ ]]; then
            echo "ERROR: PLAYBOOK_NAME must end in .yml or .yaml."
            exit 1
          fi

          if [[ ! -f "${PLAYBOOK_NAME}" ]]; then
            echo "ERROR: Playbook '${PLAYBOOK_NAME}' was not found."
            echo "Available playbooks:"

            find . \
              -maxdepth 1 \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \) \
              -printf "%f\n" \
              | sort

            exit 1
          fi

          if [[ -z "${PUSHGATEWAY_URL:-}" ]]; then
            echo "ERROR: PUSHGATEWAY_URL GitHub secret is not configured."
            exit 1
          fi

          ####################################################################
          # Build optional Ansible extra variables
          ####################################################################

          EXTRA_VARS=()

          if [[ -n "${JCL_FILE:-}" ]]; then
            EXTRA_VARS+=(
              -e
              "jcl_file=${JCL_FILE}"
            )
          fi

          if [[ -n "${STUDENT_ID:-}" ]]; then
            EXTRA_VARS+=(
              -e
              "student_id=${STUDENT_ID}"
            )
          fi

          if [[ -n "${RACF_DEFAULT_PASSWORD:-}" ]]; then
            EXTRA_VARS+=(
              -e
              "racf_default_password=${RACF_DEFAULT_PASSWORD}"
            )
          fi

          ####################################################################
          # Syntax validation
          ####################################################################

          echo "Checking playbook syntax..."

          ansible-playbook \
            -i inventory.yml \
            "${EXTRA_VARS[@]}" \
            "${PLAYBOOK_NAME}" \
            --syntax-check

          ####################################################################
          # Execute selected playbook
          ####################################################################

          echo "Running playbook: ${PLAYBOOK_NAME}"

          rm -f \
            job_metrics.prom \
            metrics.prom

          START_TIME=$(date +%s)

          set +e

          ansible-playbook \
            -i inventory.yml \
            "${EXTRA_VARS[@]}" \
            "${PLAYBOOK_NAME}"

          RESULT=$?

          set -e

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          RUN_TIMESTAMP=$(date +%s)

          ####################################################################
          # Determine workflow result metrics
          ####################################################################

          if [[ "${RESULT}" -eq 0 ]]; then
            SUCCESS=1
            FAILURE=0
          else
            SUCCESS=0
            FAILURE=1
          fi

          ####################################################################
          # Generate general GitHub Actions metrics
          ####################################################################

          cat > metrics.prom <<EOF
          # HELP github_ansible_playbook_latest_success Whether the latest playbook run succeeded
          # TYPE github_ansible_playbook_latest_success gauge
          github_ansible_playbook_latest_success{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}"} ${SUCCESS}

          # HELP github_ansible_playbook_latest_failure Whether the latest playbook run failed
          # TYPE github_ansible_playbook_latest_failure gauge
          github_ansible_playbook_latest_failure{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}"} ${FAILURE}

          # HELP github_ansible_playbook_latest_exit_code Exit code from the latest playbook run
          # TYPE github_ansible_playbook_latest_exit_code gauge
          github_ansible_playbook_latest_exit_code{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}"} ${RESULT}

          # HELP github_ansible_playbook_latest_duration_seconds Duration of the latest playbook run
          # TYPE github_ansible_playbook_latest_duration_seconds gauge
          github_ansible_playbook_latest_duration_seconds{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}"} ${DURATION}

          # HELP github_ansible_playbook_last_run_timestamp_seconds Unix timestamp of latest playbook run
          # TYPE github_ansible_playbook_last_run_timestamp_seconds gauge
          github_ansible_playbook_last_run_timestamp_seconds{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}"} ${RUN_TIMESTAMP}

          # HELP github_ansible_playbook_run_success One time series per successful build
          # TYPE github_ansible_playbook_run_success gauge
          github_ansible_playbook_run_success{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}",build="${BUILD_NUMBER}"} ${SUCCESS}

          # HELP github_ansible_playbook_run_failure One time series per failed build
          # TYPE github_ansible_playbook_run_failure gauge
          github_ansible_playbook_run_failure{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}",build="${BUILD_NUMBER}"} ${FAILURE}

          # HELP github_ansible_playbook_run_duration_seconds Duration for this specific build
          # TYPE github_ansible_playbook_run_duration_seconds gauge
          github_ansible_playbook_run_duration_seconds{playbook="${PLAYBOOK_NAME}",repo="${REPO_SLUG}",branch="${BRANCH}",build="${BUILD_NUMBER}"} ${DURATION}
          EOF

          ####################################################################
          # Append playbook-specific metrics
          ####################################################################

          if [[ -f job_metrics.prom ]]; then
            echo "" >> metrics.prom
            cat job_metrics.prom >> metrics.prom
          else
            echo "No playbook-specific job_metrics.prom file was generated."
          fi

          ####################################################################
          # Display and upload metrics
          ####################################################################

          echo "Generated Prometheus metrics:"
          cat metrics.prom

          echo "Uploading metrics to Pushgateway..."

          PUSH_URL="${PUSHGATEWAY_URL%/}"

          curl \
            --fail \
            --show-error \
            --silent \
            --connect-timeout 10 \
            --max-time 30 \
            --data-binary @metrics.prom \
            "${PUSH_URL}/metrics/job/github_ansible/playbook/${PLAYBOOK_NAME}/repo/${REPO_SLUG}/build/${BUILD_NUMBER}"

          echo
          echo "Metrics uploaded successfully."

          ####################################################################
          # Preserve the selected playbook exit code
          ####################################################################

          exit "${RESULT}"
