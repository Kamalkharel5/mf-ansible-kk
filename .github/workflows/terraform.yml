name: Terraform

on:
  push:
    tags:
      - 'v*'
    paths:
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy


env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

  TF_VAR_aws_region: ${{ secrets.AWS_DEFAULT_REGION }}
  TF_VAR_instance_type: "t3.small"
  TF_VAR_project_tag: "monitoring"
  TF_VAR_frontend_role_tag: "frontend"
  TF_VAR_backend_role_tag: "backend"
  TF_ACTION: ${{ github.event.inputs.action || 'plan' }}

  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    outputs:
      action: ${{ env.TF_ACTION }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_DEFAULT_REGION }}"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: env.TF_ACTION == 'plan'
        run: terraform plan -input=false -no-color

      - name: Terraform Apply Plan
        if: env.TF_ACTION == 'apply'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        if: env.TF_ACTION == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Outputs
        if: env.TF_ACTION == 'apply'
        run: terraform output -no-color

      - name: Terraform Destroy Plan
        if: env.TF_ACTION == 'destroy'
        run: terraform plan -destroy -input=false -no-color

      - name: Terraform Destroy
        if: env.TF_ACTION == 'destroy'
        run: terraform destroy -input=false -auto-approve
      
      - name: Trigger Ansible Deploy
        if: env.TF_ACTION == 'apply'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"terraform-applied"}'